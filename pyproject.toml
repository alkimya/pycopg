[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycopg"
version = "1.1.0"
description = "High-level Python API for PostgreSQL/PostGIS/TimescaleDB"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Loc Cosnier", email = "loc.cosnier@pm.me" }
]
keywords = [
    "postgresql",
    "postgis",
    "timescaledb",
    "database",
    "sql",
    "psycopg",
    "pandas",
    "geopandas",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.11"
dependencies = [
    "psycopg>=3.1.0",
    "psycopg_pool>=3.2.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dotenv = [
    "python-dotenv>=1.0.0",
]
geo = [
    "geopandas>=0.14.0",
    "geoalchemy2>=0.14.0",
    "shapely>=2.0.0",
]
timescale = []  # No additional deps, just PostgreSQL extension
all = [
    "python-dotenv>=1.0.0",
    "geopandas>=0.14.0",
    "geoalchemy2>=0.14.0",
    "shapely>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "interrogate>=1.7.0",
    "mypy>=2.1.0",
    "vulture>=2.9.1",
    "pytest-randomly>=3.15.0",
    "pandas-stubs>=2.0.0",
    "types-geopandas>=0.14.0",
    "types-shapely>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/alkimya/pycopg"
Documentation = "https://pycopg.readthedocs.io"
Repository = "https://github.com/alkimya/pycopg"
Issues = "https://github.com/alkimya/pycopg/issues"

[tool.hatch.build.targets.wheel]
packages = ["pycopg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pycopg --cov-report=term-missing --cov-report=html --cov-fail-under=95"
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",
    # Third-party suppressions — discovered via: uv run pytest -W error::DeprecationWarning
    # (discovery run 2026-06-28: no third-party DeprecationWarnings emitted at current dep versions;
    #  entries below are defensive suppressions for known upstream emitters)
    "ignore::DeprecationWarning:psycopg",        # third-party: psycopg driver internals
    "ignore::DeprecationWarning:geopandas",      # third-party: geopandas geometry engine
    "ignore::DeprecationWarning:pandas",         # third-party: pandas internals
]

[tool.coverage.run]
source = ["pycopg"]
omit = ["*/tests/*", "*/venv/*", "benchmarks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
    "@typing.overload",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-module = false
ignore-property-decorators = false
ignore-overloaded-functions = true
fail-under = 95
exclude = ["tests", "docs", "setup.py"]
verbose = 0
quiet = false
color = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "geoalchemy2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tenacity.*"
ignore_missing_imports = true
